<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Password Vault</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.1/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
    body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        color: #fff;
    }
    .glass-card {
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(15px);
        border-radius: 20px;
        padding: 40px 30px;
        max-width: 400px;
        width: 100%;
        text-align: center;
    }
    input.form-control {
        background: rgba(255, 255, 255, 0.15);
        border: none;
        color: #fff;
        margin-bottom: 15px;
        border-radius: 10px;
        padding: 12px;
    }
</style>
</head>

<body>

<div class="glass-card">
    <h1><i class="bi bi-person-plus-fill"></i> Register</h1>

    <form id="register-form">

        <!-- NEW FIELD -->
        <input type="text" id="profileName" class="form-control" placeholder="Enter your Name" required>

        <input type="text" id="username" class="form-control" placeholder="Username" required>

        <input type="password" id="password" class="form-control" placeholder="Password" required>

        <button type="submit" class="btn btn-light w-100 mt-2">Register</button>
    </form>

    <p class="bottom-text mt-3">Already have an account? <a href="login.html">Login</a></p>
</div>

<script>
document.getElementById("register-form").addEventListener("submit", async function(e){
    e.preventDefault();

    const profileName = document.getElementById("profileName").value;
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    const res = await fetch("https://password-vault-vk39.onrender.com/register", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ profileName, username, password })
    });

    const data = await res.json();

    if(data.message === "Registered successfully!"){
        alert(data.message);
        window.location.href = "login.html";
    } else {
        alert(data.message);
    }
});
</script>

</body>
</html>
