<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Password Vault</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.1/font/bootstrap-icons.min.css" rel="stylesheet">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body {
    font-family: "Poppins", sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    color: #fff;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
}

/* Navbar */
.navbar-custom {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    padding: 10px 30px;
}

.navbar-custom .profile-img {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    object-fit: cover;
    border: 2px solid #fff;
    transition: 0.3s;
}

.navbar-custom .profile-img:hover {
    transform: scale(1.1);
}

/* Glass Card */
.glass-card {
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(15px);
    border-radius: 20px;
    padding: 40px 30px;
    margin: 20px auto;
    max-width: 700px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    transition: transform 0.3s, box-shadow 0.3s;
}

.glass-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}

h1 {
    font-weight: 700;
    margin-bottom: 20px;
}

.password-item {
    background: rgba(255,255,255,0.1);
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.password-item button {
    background: rgba(255,255,255,0.2);
    border: none;
    border-radius: 10px;
    color: #fff;
    padding: 6px 12px;
    cursor: pointer;
    transition: 0.3s;
}

.password-item button:hover {
    background: rgba(255,255,255,0.35);
    transform: scale(1.05);
}

input.form-control {
    background: rgba(255, 255, 255, 0.15);
    border: none;
    color: #fff;
    margin-bottom: 15px;
    border-radius: 10px;
    padding: 12px;
}

input.form-control::placeholder {
    color: #e0e0e0;
}

.btn-glass {
    background: rgba(255, 255, 255, 0.2);
    color: #fff;
    border-radius: 12px;
    padding: 12px 25px;
    font-weight: 500;
    border: none;
    transition: 0.3s;
}

.btn-glass:hover {
    background: rgba(255, 255, 255, 0.35);
    transform: scale(1.03);
}

</style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-custom d-flex justify-content-between align-items-center">
    <h3>Welcome, <span id="pName"></span></h3>

    <!-- Profile dropdown -->
    <div class="dropdown">
        <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Profile" class="profile-img dropdown-toggle" id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false">
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profileDropdown">
            <li>
                <label class="dropdown-item" for="profileInput" style="cursor:pointer;">
                    <i class="bi bi-camera-fill"></i> Set Profile Picture
                </label>
                <input type="file" id="profileInput" accept="image/*" style="display:none;">
            </li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
        </ul>
    </div>
</nav>

<!-- Add Password Section -->
<div class="glass-card">
    <h1>Add New Password</h1>
    <form id="password-form">
        <input type="text" id="username" class="form-control" placeholder="Username" required>
        <input type="password" id="password" class="form-control" placeholder="Password" required>
        <button type="submit" class="btn-glass">Save Password</button>
    </form>
</div>

<!-- Password List -->
<div class="glass-card">
    <h1>My Passwords</h1>
    <div id="password-list">
        <!-- Password items will appear here -->
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
// Profile picture upload
const profileInput = document.getElementById("profileInput");
const profileImg = document.querySelector(".profile-img");

profileInput.addEventListener("change", function() {
    const file = this.files[0];
    if(file){
        const reader = new FileReader();
        reader.onload = function(e){
            profileImg.src = e.target.result;
            localStorage.setItem("profilePic", e.target.result); // Save to localStorage
        }
        reader.readAsDataURL(file);
    }
});

// Load profile picture on page load
window.addEventListener("load", () => {
    const savedPic = localStorage.getItem("profilePic");
    if(savedPic){
        profileImg.src = savedPic;
    }
});

// Logout button
document.getElementById("logoutBtn").addEventListener("click", () => {
    localStorage.removeItem("token");
    window.location.href = "login.html";
});

// Password saving (example)
document.getElementById("password-form").addEventListener("submit", async function(e){
    e.preventDefault();
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    // You can call your backend API here
    // For demo, we'll just add to the password list
    const passwordList = document.getElementById("password-list");
    const item = document.createElement("div");
    item.classList.add("password-item");
    item.innerHTML = `<span>${username} - ${password}</span><button onclick="this.parentElement.remove()">Delete</button>`;
    passwordList.appendChild(item);

    this.reset();
});
// Load username from JWT
const token = localStorage.getItem("token");

function parseJwt(token) {
    try {
        return JSON.parse(atob(token.split(".")[1]));
    } catch (e) {
        return null;
    }
}

if (!token) {
    window.location.href = "login.html";
}

const userData = parseJwt(token);

// Show username on dashboard
if (userData && userData.username) {
    document.getElementById("pName").innerText = userData.username;
} else {
    document.getElementById("pName").innerText = "User";
}

</script>

</body>
</html>
