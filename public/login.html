<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Password Vault</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.1/font/bootstrap-icons.min.css" rel="stylesheet">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
    body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        color: #fff;
        overflow: hidden;
    }

    .glass-card {
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border-radius: 20px;
        padding: 40px 30px;
        max-width: 400px;
        width: 100%;
        text-align: center;
        box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        transition: transform 0.3s, box-shadow 0.3s;
    }

    .glass-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    }

    h1 {
        font-weight: 700;
        margin-bottom: 25px;
    }

    input.form-control {
        background: rgba(255, 255, 255, 0.15);
        border: none;
        color: #fff;
        margin-bottom: 15px;
        border-radius: 10px;
        padding: 12px;
    }

    input.form-control::placeholder {
        color: #e0e0e0;
    }

    .btn-glass {
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
        border-radius: 12px;
        padding: 12px 25px;
        font-weight: 500;
        border: none;
        width: 100%;
        transition: 0.3s;
        font-size: 1rem;
    }

    .btn-glass:hover {
        background: rgba(255, 255, 255, 0.35);
        transform: scale(1.03);
    }

    p.bottom-text {
        margin-top: 20px;
    }

    p.bottom-text a {
        color: #fff;
        font-weight: 500;
        text-decoration: underline;
    }
</style>
</head>

<body>

<div class="glass-card">
    <h1><i class="bi bi-box-arrow-in-right"></i> Login</h1>

    <form id="login-form">
        <input type="text" id="username" class="form-control" placeholder="Username" required>
        <input type="password" id="password" class="form-control" placeholder="Password" required>
        <button type="submit" class="btn-glass"><i class="bi bi-box-arrow-in-right"></i> Login</button>
    </form>

    <p class="bottom-text">Don't have an account? <a href="register.html">Register</a></p>
</div>

<script>
document.getElementById("login-form").addEventListener("submit", async function(e){
    e.preventDefault();
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    const res = await fetch("https://password-vault-vk39.onrender.com/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({username, password})
    });

    const data = await res.json();
    if(data.token){
        localStorage.setItem("token", data.token);
        window.location.href = "dashboard.html";
    } else {
        alert(data.message);
    }
});
document.getElementById("login-form").addEventListener("submit", async function(e){
    e.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    const res = await fetch("https://password-vault-vk39.onrender.com/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({username, password})
    });

    const data = await res.json();

    if (data.token){
        localStorage.setItem("token", data.token);
        localStorage.setItem("profileName", data.profileName);   // <-- ADDED
        window.location.href = "dashboard.html";
    } else {
        alert(data.message);
    }
});
</script>

</body>
</html>
